name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: api (lint + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: apps/api
        run: pip install -r requirements-dev.txt

      - name: Compile check
        working-directory: apps/api
        run: python -m py_compile $(find app -name '*.py')

      - name: Test
        working-directory: apps/api
        run: pytest -q

  web:
    name: web (typecheck + lint + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci

      - name: Typecheck
        working-directory: apps/web
        run: npm run typecheck

      - name: Lint
        working-directory: apps/web
        run: npm run lint

      - name: Test
        working-directory: apps/web
        run: npm test

      - name: Build
        working-directory: apps/web
        # The build reads apps/web/../../.env at next.config.mjs load time if
        # present, but falls through cleanly when it's absent (as it is in
        # CI) — no secrets are required just to type-check the build graph.
        run: npm run build
